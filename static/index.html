<!DOCTYPE html>
<html>
<head>
  <title>HL7 FHIR Converter</title>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { color: #1d9e75; }
    textarea { width: 100%; height: 120px; padding: 10px; font-family: monospace; font-size: 13px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { padding: 10px 24px; background: #1d9e75; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; }
    button:hover { background: #0f6e56; }
    select { padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 10px; }
    pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .label { font-size: 12px; color: #888; text-transform: uppercase; font-weight: 600; margin-bottom: 6px; }
    .mapping { background: #f0faf5; border-left: 3px solid #1d9e75; padding: 8px 12px; margin: 6px 0; border-radius: 0 6px 6px 0; font-size: 13px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
    .tab { padding: 8px 18px; cursor: pointer; border-bottom: 2px solid transparent; font-size: 14px; color: #888; }
    .tab.active { border-color: #1d9e75; color: #1d9e75; font-weight: 600; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px; background: #f5f5f5; color: #888; font-size: 11px; text-transform: uppercase; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .success { background: #e1f5ee; color: #0f6e56; }
    .revoked { background: #fcebeb; color: #a32d2d; }
    .pending { background: #faeeda; color: #854f0b; }
    .role-select { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 20px; transition: 0.3s; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.3s; }
    input:checked + .slider { background: #1d9e75; }
    input:checked + .slider:before { transform: translateX(16px); }
  </style>
</head>
<body>
  <h1>⚕ HL7 ↔ FHIR Converter</h1>

  <div class="role-select">
    <label style="font-size:13px;color:#888;font-weight:600">ROLE:</label>
    <select id="role">
      <option>Clinician</option>
      <option>Admin</option>
      <option>Analyst</option>
      <option>Viewer</option>
    </select>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('converter')">Converter</div>
    <div class="tab" onclick="showTab('audit')">Audit Log</div>
    <div class="tab" onclick="showTab('consent')">Consent</div>
  </div>

  <!-- Converter -->
  <div id="tab-converter">
    <div class="card">
      <div class="label">Direction</div>
      <select id="direction">
        <option value="hl7ToFhir">HL7 v2 → FHIR R4</option>
        <option value="fhirToHl7">FHIR R4 → HL7 v2</option>
      </select>
      <div class="label">Paste your message here</div>
      <textarea id="input">MSH|^~\&|HOSPITAL|ADT||20240101||ADT^A01|MSG001|P|2.5
PID|1||12345|||DOE^JOHN||19800101|M</textarea>
      <button onclick="convert()">Convert</button>
    </div>
    <div id="result"></div>
  </div>

  <!-- Audit Log -->
  <div id="tab-audit" class="hidden">
    <div class="card">
      <div class="label">HIPAA Audit Trail</div>
      <button onclick="loadAudit()" style="margin-bottom:12px">Refresh</button>
      <div id="audit-list"></div>
    </div>
  </div>

  <!-- Consent -->
  <div id="tab-consent" class="hidden">
    <div class="card">
      <div class="label">GDPR Consent Management</div>
      <p style="font-size:13px;color:#888;margin-bottom:12px">Toggle consent for each patient. Only Admin and Clinician roles can make changes.</p>
      <div id="consent-list"></div>
    </div>
  </div>

  <script>
    const BASE = "https://hl7-converter-production.up.railway.app";

    function showTab(name) {
      ["converter", "audit", "consent"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== name);
      });
      document.querySelectorAll(".tab").forEach((el, i) => {
        el.classList.toggle("active", ["converter", "audit", "consent"][i] === name);
      });
      if (name === "audit")   loadAudit();
      if (name === "consent") loadConsent();
    }

    async function convert() {
      const role      = document.getElementById("role").value;
      const direction = document.getElementById("direction").value;
      const input     = document.getElementById("input").value;
      const resultDiv = document.getElementById("result");

      if (role === "Viewer") {
        resultDiv.innerHTML = '<div class="card" style="border-left:3px solid orange"><p style="color:#854f0b">⚠ Viewer role cannot convert data.</p></div>';
        return;
      }

      resultDiv.innerHTML = "<p>Converting...</p>";

      const response = await fetch(BASE + "/api/convert", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ input_text: input, direction, role })
      });

      const data = await response.json();
      const converted = typeof data.converted === "string"
        ? data.converted
        : JSON.stringify(data.converted, null, 2);

      const mappings = data.mappings.map(m => `
        <div class="mapping">
          <strong>${m.source}</strong> → <strong>${m.target}</strong>
          · ${Math.round(m.confidence * 100)}% confidence · ${m.notes}
        </div>`).join("");

      resultDiv.innerHTML = `
        <div class="card"><div class="label">Summary</div><p>${data.summary}</p></div>
        <div class="card"><div class="label">Converted Output</div><pre>${converted}</pre></div>
        <div class="card"><div class="label">AI Field Mappings</div>${mappings}</div>`;
    }

    async function loadAudit() {
      const res  = await fetch(BASE + "/api/audit");
      const logs = await res.json();
      if (logs.length === 0) {
        document.getElementById("audit-list").innerHTML = "<p style='color:#888'>No conversions yet.</p>";
        return;
      }
      document.getElementById("audit-list").innerHTML = `
        <table>
          <thead><tr><th>#</th><th>Time</th><th>User</th><th>Action</th><th>Status</th></tr></thead>
          <tbody>${logs.map(l => `
            <tr>
              <td>${l.id}</td>
              <td>${l.timestamp}</td>
              <td>${l.user}</td>
              <td>${l.action}</td>
              <td><span class="badge success">${l.status}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>`;
    }

    async function loadConsent() {
      const res     = await fetch(BASE + "/api/consent");
      const records = await res.json();
      const role    = document.getElementById("role").value;
      const canEdit = ["Admin", "Clinician"].includes(role);

      document.getElementById("consent-list").innerHTML = `
        <table>
          <thead><tr><th>Patient</th><th>GDPR</th><th>HIPAA</th><th>Research</th><th>Updated</th><th>Status</th></tr></thead>
          <tbody>${records.map(p => `
            <tr>
              <td><strong>${p.name}</strong><br><small style="color:#888">${p.id}</small></td>
              <td><label class="toggle"><input type="checkbox" ${p.gdpr ? "checked" : ""} ${!canEdit ? "disabled" : ""} onchange="updateConsent('${p.id}', 'gdpr', this.checked)"><span class="slider"></span></label></td>
              <td><label class="toggle"><input type="checkbox" ${p.hipaa ? "checked" : ""} ${!canEdit ? "disabled" : ""} onchange="updateConsent('${p.id}', 'hipaa', this.checked)"><span class="slider"></span></label></td>
              <td><label class="toggle"><input type="checkbox" ${p.research ? "checked" : ""} ${!canEdit ? "disabled" : ""} onchange="updateConsent('${p.id}', 'research', this.checked)"><span class="slider"></span></label></td>
              <td style="font-size:12px;color:#888">${p.last_updated}</td>
              <td><span class="badge ${p.status}">${p.status}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>`;
    }

    async function updateConsent(patientId, field, value) {
      const role = document.getElementById("role").value;
      await fetch(`${BASE}/api/consent/${patientId}?role=${role}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ field, value })
      });
      loadConsent();
    }
  </script>
</body>
</html>
